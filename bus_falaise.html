<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bus de Falaise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 420, H = 640;
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
resize();
window.addEventListener('resize', resize);

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    const rad = typeof r === 'number' ? r : (Array.isArray(r) ? r[0] : 0);
    this.moveTo(x + rad, y);
    this.lineTo(x + w - rad, y);
    this.quadraticCurveTo(x + w, y, x + w, y + rad);
    this.lineTo(x + w, y + h - rad);
    this.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    this.lineTo(x + rad, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - rad);
    this.lineTo(x, y + rad);
    this.quadraticCurveTo(x, y, x + rad, y);
    this.closePath();
    return this;
  };
}

// ── Road ─────────────────────────────────────────────────────────────────
const SEG_H = 5;
let road = [], roadStart = 0, totalScroll = 0;
let genX = W/2, genVx = 0, genAx = 0;
let roadWidth = 200, gameSpeed = 3, frame = 0;

function genStrip() {
  if (Math.random() < 0.025) genAx = (Math.random() - 0.5) * 0.55;
  genVx += genAx;
  genVx = Math.max(-5, Math.min(5, genVx)) * 0.97;
  genX  += genVx;
  genX   = Math.max(95, Math.min(W - 95, genX));
  road.push(genX);
}

function getRoad(g) {
  const i = g - roadStart;
  return (i >= 0 && i < road.length) ? road[i] : W/2;
}

function initRoad() {
  road = []; roadStart = 0; totalScroll = 0;
  genX = W/2; genVx = 0; genAx = 0;
  for (let i = 0; i < Math.ceil(H/SEG_H) + 30; i++) genStrip();
}

function maintainRoad() {
  const need = Math.floor((totalScroll + H) / SEG_H) + 30;
  while (roadStart + road.length <= need) genStrip();
  const trim = Math.floor(totalScroll / SEG_H) - 5 - roadStart;
  if (trim > 0) { road.splice(0, trim); roadStart += trim; }
}

// ── Bus ───────────────────────────────────────────────────────────────────
let busX = W/2, busVx = 0;
const BUS_W = 28, BUS_H = 50, BUS_Y = H - 110;

// ── Input ─────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

let touchLeft = false, touchRight = false;
canvas.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    ((t.clientX - r.left) / (r.width / W) < W/2) ? (touchLeft=true) : (touchRight=true);
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  touchLeft = touchRight = false; e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  touchLeft = touchRight = false;
  for (const t of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    ((t.clientX - r.left) / (r.width / W) < W/2) ? (touchLeft=true) : (touchRight=true);
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('click', () => {
  if (state === 'menu') reset();
  else if (state === 'dead' && deathPhase > 60) state = 'menu';
});

// ── State ─────────────────────────────────────────────────────────────────
let state = 'menu', score = 0, best = 0;
let deathPhase = 0, deathX = W/2, deathY = BUS_Y;
let particles = [];

function spawnParticles(x, y) {
  particles = Array.from({length: 22}, () => {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 5;
    return {
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
      life: 1,
      color: ['#FFA000','#FF6D00','#FF3D00','#FFD740','#fff'][Math.floor(Math.random()*5)],
      size: 2 + Math.random() * 5
    };
  });
}

function reset() {
  initRoad(); busX = W/2; busVx = 0;
  roadWidth = 200; gameSpeed = 3; frame = 0; score = 0;
  particles = []; state = 'playing'; deathPhase = 0;
}

// ── Collision ─────────────────────────────────────────────────────────────
function checkCollision() {
  const hw = roadWidth / 2;
  const pts = [
    [busX,               BUS_Y - BUS_H/2 + 2],
    [busX - BUS_W/2 + 3, BUS_Y - BUS_H/2 + 6],
    [busX + BUS_W/2 - 3, BUS_Y - BUS_H/2 + 6],
    [busX - BUS_W/2 + 3, BUS_Y],
    [busX + BUS_W/2 - 3, BUS_Y],
  ];
  for (const [px, py] of pts) {
    const cx = getRoad(Math.floor((py + totalScroll) / SEG_H));
    if (px < cx - hw + 3 || px > cx + hw - 3) return true;
  }
  return false;
}

// ── Update ────────────────────────────────────────────────────────────────
function update() {
  if (state === 'dead') { deathPhase++; updateParticles(); return; }
  if (state !== 'playing') return;

  frame++;
  score     = Math.floor(frame / 5);
  gameSpeed = Math.min(10, 3 + frame * 0.0012);
  roadWidth = Math.max(68, 200 - frame * 0.03);

  const left  = keys['ArrowLeft']  || keys['KeyA'] || touchLeft;
  const right = keys['ArrowRight'] || keys['KeyD'] || touchRight;
  if (left)  busVx -= 0.42;
  if (right) busVx += 0.42;
  busVx *= 0.82;
  busVx  = Math.max(-7, Math.min(7, busVx));
  busX  += busVx;
  busX   = Math.max(BUS_W/2+1, Math.min(W-BUS_W/2-1, busX));

  totalScroll += gameSpeed;
  maintainRoad();

  if (checkCollision()) {
    best = Math.max(best, score);
    deathX = busX; deathY = BUS_Y;
    spawnParticles(busX, BUS_Y);
    state = 'dead'; deathPhase = 0;
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18;
    p.life -= 0.022; p.size *= 0.97;
  }
  particles = particles.filter(p => p.life > 0);
}

// ── Draw helpers ──────────────────────────────────────────────────────────
function drawBackground() {
  ctx.fillStyle = '#120800';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(50,22,0,0.35)';
  for (let y = 0; y < H; y += 28) {
    for (let x = 0; x < W; x += 22) {
      const n = (x * 3 + y * 7) % 41;
      if (n < 16) ctx.fillRect(x + n%4, y + n%3, 17 + n%7, 23 + n%6);
    }
  }
}

function drawRoad() {
  const g0 = Math.floor(totalScroll / SEG_H) - 1;
  const g1 = Math.ceil((totalScroll + H) / SEG_H) + 1;
  for (let g = g0; g <= g1; g++) {
    const sy = g * SEG_H - totalScroll;
    if (sy > H + SEG_H || sy < -SEG_H) continue;
    const cx = getRoad(g), hw = roadWidth / 2;
    ctx.fillStyle = Math.floor(g / 2) % 2 === 0 ? '#3c3c3c' : '#383838';
    ctx.fillRect(cx - hw, sy - 1, roadWidth, SEG_H + 2);
    ctx.fillStyle = '#ddd';
    ctx.fillRect(cx - hw,      sy - 1, 4, SEG_H + 2);
    ctx.fillRect(cx + hw - 4,  sy - 1, 4, SEG_H + 2);
    if (Math.floor(g / 4) % 2 === 0) {
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(cx - 2, sy - 1, 4, SEG_H + 2);
    }
  }
  // Vignette sides
  const lg = ctx.createLinearGradient(0, 0, 88, 0);
  lg.addColorStop(0, 'rgba(0,0,0,0.92)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, 88, H);
  const rg = ctx.createLinearGradient(W, 0, W-88, 0);
  rg.addColorStop(0, 'rgba(0,0,0,0.92)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(W-88, 0, 88, H);
}

function drawBus(x, y, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  const w = BUS_W, h = BUS_H;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(-w/2+4, -h/2+5, w, h);

  // Body
  ctx.fillStyle = '#FFA000';
  ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 4); ctx.fill();

  // Body shading
  const sg = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  sg.addColorStop(0, 'rgba(255,255,255,0.18)');
  sg.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 4); ctx.fill();

  // Roof band
  ctx.fillStyle = '#E65100';
  ctx.fillRect(-w/2, -h/2, w, 7);

  // Windshield (front = top)
  ctx.fillStyle = '#B3D9F5';
  ctx.fillRect(-w/2+3, -h/2+8, w-6, 11);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
  ctx.strokeRect(-w/2+3, -h/2+8, w-6, 11);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(-w/2+4, -h/2+9, 4, 3);

  // Side windows
  ctx.fillStyle = '#B3D9F5';
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(-w/2+3, -h/2+22+i*10, w-6, 7);
    ctx.strokeRect(-w/2+3, -h/2+22+i*10, w-6, 7);
  }

  // Rear window
  ctx.fillRect(-w/2+3, h/2-10, w-6, 7);
  ctx.strokeRect(-w/2+3, h/2-10, w-6, 7);

  // Headlights
  ctx.save();
  ctx.shadowColor = '#FFEE58'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#FFEE58';
  ctx.fillRect(-w/2+3, -h/2+1, 5, 4);
  ctx.fillRect(w/2-8,  -h/2+1, 5, 4);
  ctx.restore();

  // Wheels
  const wh = [[-w/2-3,-h/2+8],[w/2-2,-h/2+8],[-w/2-3,h/2-16],[w/2-2,h/2-16]];
  for (const [wx,wy] of wh) {
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(wx, wy, 5, 8);
    ctx.fillStyle = '#333';    ctx.fillRect(wx+1, wy+1, 3, 6);
  }

  // Label
  ctx.fillStyle = '#7B3300';
  ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center';
  ctx.fillText('BUS', 0, 5);

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Speed lines
const speedLines = Array.from({length: 18}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  len: 15+Math.random()*35, spd: 2+Math.random()*3
}));
function drawSpeedLines() {
  if (gameSpeed < 5) return;
  const intensity = Math.min(1, (gameSpeed-5)/4);
  ctx.strokeStyle = `rgba(255,255,255,${intensity*0.07})`;
  ctx.lineWidth = 1; ctx.beginPath();
  for (const l of speedLines) {
    l.y += l.spd * (gameSpeed/3);
    if (l.y > H + l.len) { l.y = -l.len; l.x = Math.random()*W; }
    ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + l.len);
  }
  ctx.stroke();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  ctx.fillRect(0, 0, W, 42);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Segoe UI'; ctx.textAlign = 'left';
  ctx.fillText('📏 ' + score + ' m', 12, 26);
  const kmh = Math.floor(gameSpeed * 17);
  ctx.fillStyle = gameSpeed > 7 ? '#ff4444' : gameSpeed > 5 ? '#ffaa00' : '#44dd88';
  ctx.textAlign = 'right';
  ctx.fillText('⚡ ' + kmh + ' km/h', W-12, 26);
  if (best > 0) {
    ctx.fillStyle = '#FFD700'; ctx.font = '11px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText('Record: ' + best + ' m', W/2, 38);
  }
  if (roadWidth < 120) {
    const blink = Math.sin(Date.now()/180)*0.5+0.5;
    ctx.fillStyle = `rgba(255,50,50,${blink*0.13})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,90,90,${blink})`;
    ctx.font = 'bold 12px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText('⚠ ROUTE TRÈS ÉTROITE ⚠', W/2, 60);
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 28;
  ctx.fillStyle = '#FFA000';
  ctx.font = 'bold 36px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('BUS DE FALAISE', W/2, 115);
  ctx.restore();

  ctx.fillStyle = '#bbb'; ctx.font = '15px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('Restez sur la route!', W/2, 150);
  ctx.fillText('Ne tombez pas dans le vide!', W/2, 172);

  drawBus(W/2, 240);

  ctx.fillStyle = '#777'; ctx.font = '13px Segoe UI';
  ctx.fillText('← → ou A / D pour diriger', W/2, 308);
  ctx.fillText('Clic / Toucher pour jouer', W/2, 328);

  const p = Math.sin(Date.now()/500)*3;
  ctx.fillStyle = '#FFA000';
  ctx.beginPath();
  ctx.roundRect(W/2-112-p, 348-p/2, 224+p*2, 50+p, 12);
  ctx.fill();
  ctx.fillStyle = '#000'; ctx.font = 'bold 16px Segoe UI';
  ctx.fillText('▶  JOUER  (ESPACE)', W/2, 380);

  if (best > 0) {
    ctx.fillStyle = '#FFD700'; ctx.font = '15px Segoe UI';
    ctx.fillText('🏆 Meilleur: ' + best + ' m', W/2, 430);
  }

  ctx.fillStyle = '#ff5555'; ctx.font = 'bold 13px Segoe UI';
  ctx.fillText('⚠  Aucune erreur permise!', W/2, H - 26);
}

function drawDead() {
  const oa = Math.min(0.82, deathPhase/25);
  ctx.fillStyle = `rgba(150,0,0,${oa})`;
  ctx.fillRect(0, 0, W, H);

  drawParticles();

  // Falling + tilting bus
  if (deathPhase < 90) {
    const fall  = Math.max(0, deathPhase - 10);
    const fy    = deathY + fall * fall * 0.1;
    const fa    = Math.max(0, 1 - fall/55);
    const tilt  = (deathX > W/2 ? 1 : -1) * Math.min(deathPhase * 0.03, 1.1);
    ctx.save();
    ctx.translate(deathX, fy);
    ctx.rotate(tilt);
    drawBus(0, 0, fa);
    ctx.restore();
  }

  if (deathPhase < 22) return;
  const fi = Math.min(1, (deathPhase-22)/18);
  ctx.globalAlpha = fi;

  ctx.font = 'bold 52px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText('💥', W/2, 168);

  ctx.fillStyle = '#ff3333'; ctx.font = 'bold 26px Segoe UI';
  ctx.fillText('TOMBÉ DANS LE VIDE!', W/2, 222);

  ctx.fillStyle = '#fff'; ctx.font = '20px Segoe UI';
  ctx.fillText('Distance: ' + score + ' m', W/2, 268);

  if (score >= best && score > 0) {
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 17px Segoe UI';
    ctx.fillText('🏆 NOUVEAU RECORD!', W/2, 306);
  }

  if (deathPhase > 60) {
    const bp = Math.sin(Date.now()/400)*0.15+0.85;
    ctx.globalAlpha = fi * bp;
    ctx.fillStyle = '#FFA000';
    ctx.beginPath();
    ctx.roundRect(W/2-108, 338, 216, 48, 10);
    ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 15px Segoe UI';
    ctx.fillText('RECOMMENCER (ESPACE)', W/2, 368);
  }
  ctx.globalAlpha = 1;
}

// ── Main loop ─────────────────────────────────────────────────────────────
function loop() {
  if (keys['Space'] || keys['Enter']) {
    if (state === 'menu') {
      reset(); keys['Space'] = keys['Enter'] = false;
    } else if (state === 'dead' && deathPhase > 60) {
      state = 'menu'; keys['Space'] = keys['Enter'] = false;
    }
  }

  update();

  drawBackground();
  drawRoad();

  if (state === 'playing') {
    drawSpeedLines();
    drawBus(busX, BUS_Y);
    drawHUD();
  } else if (state === 'menu') {
    drawMenu();
  } else if (state === 'dead') {
    drawDead();
    drawHUD();
  }

  requestAnimationFrame(loop);
}

initRoad();
loop();
</script>
</body>
</html>
